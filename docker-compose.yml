services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: exploro-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - ATLASDB_URL=mongodb://mongo:27017/exploro
      - SECRET=${SECRET:-exploro_super_secret_session_key_2026}
      - CLOUD_NAME=${CLOUD_NAME:-}
      - CLOUD_API_KEY=${CLOUD_API_KEY:-}
      - CLOUD_API_SECRET=${CLOUD_API_SECRET:-}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - exploro-network

  mongo:
    image: mongo:7.0
    container_name: exploro-db
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - exploro-network

volumes:
  mongo_data:
    driver: local

networks:
  exploro-network:
    driver: bridge
